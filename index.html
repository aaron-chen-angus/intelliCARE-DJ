<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTELLICARE DJ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            background-attachment: fixed;
            color: white;
            height: 100vh;
            height: 100dvh; /* Use dynamic viewport height for mobile */
            display: flex;
            overflow: hidden;
            user-select: none;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            margin: 0;
            padding: 0;
        }

        /* Ensure dark background is always visible */
        html {
            background: #0a0a0a;
            margin: 0;
            padding: 0;
        }

        .main-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(10, 10, 20, 0.5);
            flex-shrink: 0;
        }

        .center-title-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .app-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #00ff88 0%, #00d4ff 50%, #ff00ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
            letter-spacing: 6px;
            line-height: 1;
        }

        .app-subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            line-height: 1;
        }

        .stop-button {
            width: 50px;
            height: 50px;
            border: 3px solid #00d4ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(0, 212, 255, 0.1);
        }

        .stop-button:hover {
            background: rgba(0, 212, 255, 0.3);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .stop-button svg {
            width: 24px;
            height: 24px;
            fill: #00d4ff;
        }

        .deck-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .turntable-container {
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #1a1a2e 0%, #0a0a0a 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 3px solid #333;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            flex-shrink: 0;
        }

        .turntable-container.loaded {
            border-color: #00ff88;
            box-shadow: 0 8px 30px rgba(0, 255, 136, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .vinyl {
            width: 72px;
            height: 72px;
            background: radial-gradient(circle, #2a2a3e 0%, #0a0a0a 70%);
            border-radius: 50%;
            position: relative;
            transition: all 0.3s;
        }

        .vinyl::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff0066;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(255, 0, 102, 0.6);
        }

        .vinyl::after {
            content: '';
            position: absolute;
            width: 45px;
            height: 45px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .vinyl.spinning {
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .deck-info-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 140px;
        }

        .deck-info {
            text-align: left;
        }

        .deck-label {
            font-size: 9px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .track-name {
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            max-width: 140px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bpm-display {
            font-size: 16px;
            font-weight: bold;
            color: #00ff88;
            margin-top: 2px;
        }

        .bpm-label {
            font-size: 9px;
            color: #666;
        }

        .eject-button {
            padding: 5px 12px;
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            border-radius: 6px;
            color: #ff4444;
            font-size: 9px;
            cursor: pointer;
            transition: all 0.2s;
            align-self: flex-start;
        }

        .eject-button:hover {
            background: #ff4444;
            color: white;
        }

        .eject-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .playlist-sidebar {
            width: 300px;
            background: rgba(10, 10, 10, 0.95);
            border-left: 1px solid rgba(102, 126, 234, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .playlist-header {
            padding: 20px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
            border-bottom: 1px solid rgba(102, 126, 234, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playlist-title {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-track-btn {
            background: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
        }

        .add-track-btn:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 6px 25px rgba(0, 255, 136, 0.6);
        }

        .playlist-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .playlist-container::-webkit-scrollbar {
            width: 8px;
        }

        .playlist-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        .playlist-container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
        }

        .playlist-item {
            background: rgba(33, 33, 33, 0.8);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            gap: 12px;
            align-items: center;
            transition: all 0.3s;
        }

        .playlist-item:hover {
            background: rgba(50, 50, 50, 0.9);
            border-color: rgba(102, 126, 234, 0.5);
            transform: translateX(-5px);
        }

        .playlist-thumbnail {
            width: 55px;
            height: 55px;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .playlist-info {
            flex: 1;
            min-width: 100px;
            max-width: 200px;
            overflow: visible;
            padding-right: 8px;
        }

        .playlist-song {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
            width: 100%;
        }

        .playlist-artist {
            font-size: 11px;
            color: #999;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .playlist-bpm {
            font-size: 10px;
            color: #00ff88;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .playlist-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .load-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 2px solid;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .load-btn.left {
            border-color: #00ff88;
            color: #00ff88;
        }

        .load-btn.left:hover {
            background: #00ff88;
            color: black;
            box-shadow: 0 0 15px #00ff88;
        }

        .load-btn.right {
            border-color: #00d4ff;
            color: #00d4ff;
        }

        .load-btn.right:hover {
            background: #00d4ff;
            color: black;
            box-shadow: 0 0 15px #00d4ff;
        }

        .remove-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 2px solid #ff4444;
            background: transparent;
            color: #ff4444;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .remove-btn:hover {
            background: #ff4444;
            color: white;
            box-shadow: 0 0 15px #ff4444;
        }

        .waveforms-container {
            padding: 0 20px 10px 20px;
            height: 80px;
            min-height: 50px;
            display: flex;
            gap: 15px;
            flex-shrink: 0;
        }

        .waveform-wrapper {
            position: relative;
            flex: 1;
            background: rgba(10, 10, 20, 0.8);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid rgba(102, 126, 234, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .waveform-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .playhead {
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom, #00ff88, #00d4ff);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.8);
            z-index: 10;
        }

        .time-display {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.8);
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: 600;
            color: #00ff88;
            z-index: 5;
        }

        .waveform-label {
            position: absolute;
            top: 6px;
            left: 6px;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.9);
            z-index: 5;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .pads-container {
            flex: 1;
            padding: 8px 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, minmax(65px, 1fr));
            gap: 8px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .pads-container::-webkit-scrollbar {
            width: 6px;
        }

        .pads-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        .pads-container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 3px;
        }

        .drum-pad {
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: all 0.1s;
            user-select: none;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
            min-height: 65px;
        }

        .drum-pad.has-sound {
            border: 2px solid rgba(0, 255, 136, 0.8);
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3), 0 0 12px rgba(0, 255, 136, 0.4);
        }

        .drum-pad:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .drum-pad:active {
            transform: scale(0.96);
        }

        .drum-pad.pressed {
            filter: brightness(1.4);
            box-shadow: 0 0 25px currentColor;
            transform: scale(1.04);
        }

        .pad-icon {
            font-size: 24px;
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
        }

        .pad-name {
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .keyboard-hint {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .sound-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 12px;
            height: 12px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff88;
        }

        .volume-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
        }

        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(10, 10, 20, 0.8);
            flex-shrink: 0;
            min-height: 70px;
        }

        .play-button {
            width: 60px;
            height: 60px;
            border: 3px solid #666;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(10, 10, 20, 0.5);
        }

        .play-button:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.5);
        }

        .play-button.playing {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
        }

        .play-button svg {
            width: 30px;
            height: 30px;
            fill: white;
        }

        .middle-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .skip-button {
            cursor: pointer;
            transition: all 0.2s;
            padding: 8px;
            border-radius: 50%;
        }

        .skip-button:hover {
            background: rgba(0, 212, 255, 0.2);
            transform: scale(1.1);
        }

        .skip-button svg {
            width: 30px;
            height: 30px;
            fill: #9e9e9e;
            transition: fill 0.2s;
        }

        .skip-button:hover svg {
            fill: #00d4ff;
        }

        .slider-container {
            width: 200px;
            height: 60px;
            background: rgba(20, 20, 30, 0.8);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            position: relative;
            border: 2px solid rgba(102, 126, 234, 0.3);
        }

        .track-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: linear-gradient(to right, #00ff88 0%, #667eea 50%, #00d4ff 100%);
            outline: none;
            border-radius: 3px;
        }

        .track-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 35px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.8);
        }

        .track-slider::-moz-range-thumb {
            width: 20px;
            height: 35px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.8);
        }

        .track-name-label {
            position: absolute;
            bottom: -25px;
            font-size: 11px;
            color: #999;
            white-space: nowrap;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 30px;
            border-radius: 20px;
            min-width: 350px;
            max-width: 450px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(102, 126, 234, 0.3);
        }

        .modal-title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .rename-control {
            margin-bottom: 20px;
        }

        .rename-control label {
            display: block;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 600;
        }

        .rename-control input {
            width: 100%;
            padding: 14px;
            background: rgba(30, 30, 50, 0.8);
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 16px;
        }

        .rename-control input:focus {
            outline: none;
            border-color: #00ff88;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .volume-control svg {
            width: 24px;
            height: 24px;
            fill: rgba(255, 255, 255, 0.7);
        }

        .volume-slider {
            flex: 1;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(50, 50, 70, 0.8);
            outline: none;
            border-radius: 4px;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: currentColor;
            cursor: pointer;
            box-shadow: 0 0 10px currentColor;
        }

        .volume-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: currentColor;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px currentColor;
        }

        .volume-percent {
            min-width: 50px;
            text-align: right;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 700;
        }

        .modal-button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            transition: all 0.3s;
        }

        .modal-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .modal-button.primary {
            background: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
            color: white;
        }

        .modal-button.danger {
            background: transparent;
            border: 2px solid #ff4444;
            color: #ff4444;
        }

        .modal-button.danger:hover {
            background: rgba(255, 68, 68, 0.2);
        }

        .modal-button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        input[type="file"] {
            display: none;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 30, 0.95);
            color: white;
            padding: 18px 24px;
            border-radius: 12px;
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.7);
            z-index: 2000;
            animation: slideIn 0.3s ease;
            border: 2px solid;
            backdrop-filter: blur(10px);
        }

        .notification.success {
            border-color: #00ff88;
            box-shadow: 0 6px 30px rgba(0, 255, 136, 0.4);
        }

        .notification.error {
            border-color: #ff4444;
            box-shadow: 0 6px 30px rgba(255, 68, 68, 0.4);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .empty-playlist {
            text-align: center;
            padding: 50px 20px;
            color: #666;
        }

        .empty-playlist-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .loading-message {
            text-align: center;
            padding: 20px;
            color: #00d4ff;
            font-size: 14px;
        }

        /* Red shades */

        async function playPad(index) {
            const pad = pads[index];
            
            console.log(`🎯 Tapped pad ${index}: ${pad.config.name}`);
            
            pad.element.classList.add('pressed');
            setTimeout(() => {
                pad.element.classList.remove('pressed');
            }, 150);
            
            if (USE_HTML5_AUDIO) {
                // Mobile: Use HTML5 Audio
                console.log(`📱 Mobile mode - checking audioElement for pad ${index}`);
                console.log(`   audioElement exists: ${!!pad.audioElement}`);
                console.log(`   audioURL: ${pad.audioURL}`);
                
                if (pad.audioElement || pad.audioURL) {
                    try {
                        // Create a new Audio instance each time - most reliable on mobile
                        const audio = new Audio(pad.audioURL || pad.audioElement.src);
                        audio.volume = pad.volume;
                        
                        console.log(`   Created new Audio, attempting play...`);
                        
                        const playPromise = audio.play();
                        if (playPromise !== undefined) {
                            playPromise
                                .then(() => {
                                    console.log(`✅ Playing (HTML5) pad ${index}: ${pad.config.name}`);
                                })
                                .catch(error => {
                                    console.error(`❌ Play error for pad ${index}:`, error.name, error.message);
                                    showNotification('Tap "TAP TO ENABLE AUDIO" button first', 'error');
                                });
                        }
                    } catch (error) {
                        console.error(`❌ Exception playing pad ${index}:`, error);
                    }
                } else {
                    console.warn(`⚠️ Pad ${index} has no audio element or URL`);
                }
            } else {
                // Desktop: Use Web Audio API
                const ctx = getAudioContext();
                
                // CRITICAL: Ensure audio context is running
                if (ctx.state === 'suspended') {
                    try {
                        await ctx.resume();
                        console.log('✅ Audio resumed in playPad');
                    } catch (error) {
                        console.error('❌ Failed to resume audio:', error);
                        showNotification('Tap screen first to enable audio', 'error');
                        return;
                    }
                }
                
                if (pad.audioBuffer) {
                    try {
                        const source = ctx.createBufferSource();
                        const gainNode = ctx.createGain();
                        
                        source.buffer = pad.audioBuffer;
                        gainNode.gain.value = pad.volume;
                        
                        source.connect(gainNode);
                        gainNode.connect(ctx.destination);
                        
                        source.start(0);
                        console.log(`🔊 Playing (Web Audio) pad ${index}: ${pad.config.name}`);
                    } catch (error) {
                        console.error('❌ Error playing pad:', error);
                    }
                } else {
                    console.warn(`⚠️ Pad ${index} has no audio buffer`);
                }
            }
            
            updatePadDisplay(index);
        }

        function detectBPM(buffer) {
            const sampleRate = buffer.sampleRate;
            const channelData = buffer.getChannelData(0);
            
            const analyzeDuration = Math.min(30, buffer.duration);
            const analyzeLength = Math.floor(analyzeDuration * sampleRate);
            
            const windowSize = Math.floor(sampleRate * 0.02);
            const hopSize = Math.floor(windowSize / 2);
            const energyValues = [];
            
            for (let i = 0; i < analyzeLength; i += hopSize) {
                let energy = 0;
                for (let j = 0; j < windowSize && i + j < analyzeLength; j++) {
                    const sample = channelData[i + j];
                    energy += sample * sample;
                }
                energyValues.push(Math.sqrt(energy / windowSize));
            }
            
            const smoothed = [];
            const smoothWindow = 3;
            for (let i = 0; i < energyValues.length; i++) {
                let sum = 0;
                let count = 0;
                for (let j = -smoothWindow; j <= smoothWindow; j++) {
                    const idx = i + j;
                    if (idx >= 0 && idx < energyValues.length) {
                        sum += energyValues[idx];
                        count++;
                    }
                }
                smoothed.push(sum / count);
            }
            
            const mean = smoothed.reduce((a, b) => a + b) / smoothed.length;
            const stdDev = Math.sqrt(smoothed.reduce((sq, n) => sq + Math.pow(n - mean, 2), 0) / smoothed.length);
            const threshold = mean + stdDev * 0.5;
            
            const peaks = [];
            for (let i = 2; i < smoothed.length - 2; i++) {
                if (smoothed[i] > threshold && 
                    smoothed[i] > smoothed[i-1] && 
                    smoothed[i] > smoothed[i-2] &&
                    smoothed[i] > smoothed[i+1] && 
                    smoothed[i] > smoothed[i+2]) {
                    peaks.push(i);
                }
            }
            
            if (peaks.length < 2) return 120;
            
            const intervals = [];
            for (let i = 1; i < peaks.length; i++) {
                const interval = peaks[i] - peaks[i-1];
                if (interval > 0) {
                    intervals.push(interval);
                }
            }
            
            if (intervals.length === 0) return 120;
            
            const histogram = {};
            intervals.forEach(interval => {
                const bucket = Math.round(interval / 5) * 5;
                histogram[bucket] = (histogram[bucket] || 0) + 1;
            });
            
            let maxCount = 0;
            let bestInterval = 0;
            for (const [interval, count] of Object.entries(histogram)) {
                if (count > maxCount) {
                    maxCount = count;
                    bestInterval = parseInt(interval);
                }
            }
            
            const timePerBeat = (bestInterval * hopSize) / sampleRate;
            let bpm = 60 / timePerBeat;
            
            while (bpm < 60) bpm *= 2;
            while (bpm > 200) bpm /= 2;
            
            return Math.round(bpm);
        }

        function drawWaveform(buffer, side) {
            const canvas = document.getElementById(side + 'Canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            
            const width = canvas.width;
            const height = canvas.height;
            const centerY = height / 2;
            
            ctx.fillStyle = 'rgba(10, 10, 20, 0.8)';
            ctx.fillRect(0, 0, width, height);
            
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, centerY);
            ctx.lineTo(width, centerY);
            ctx.stroke();
            
            const channelData = buffer.getChannelData(0);
            const samples = channelData.length;
            const samplesPerPixel = Math.floor(samples / width);
            
            ctx.fillStyle = '#ffeb3b';
            
            for (let x = 0; x < width; x++) {
                let sum = 0;
                let count = 0;
                
                for (let i = 0; i < samplesPerPixel; i++) {
                    const index = Math.floor(x * samplesPerPixel + i);
                    if (index < samples) {
                        sum += Math.abs(channelData[index]);
                        count++;
                    }
                }
                
                if (count > 0) {
                    const amplitude = sum / count;
                    const barHeight = amplitude * height * 2;
                    
                    ctx.fillRect(x, centerY - barHeight / 2, 1, barHeight);
                }
            }
        }

        // Simple waveform for mobile (static pattern)
        function drawSimpleWaveform(side) {
            const canvas = document.getElementById(side + 'Canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            
            const width = canvas.width;
            const height = canvas.height;
            const centerY = height / 2;
            
            // Background
            ctx.fillStyle = 'rgba(10, 10, 20, 0.8)';
            ctx.fillRect(0, 0, width, height);
            
            // Center line
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, centerY);
            ctx.lineTo(width, centerY);
            ctx.stroke();
            
            // Draw a nice static waveform pattern
            ctx.fillStyle = '#ffeb3b';
            
            for (let x = 0; x < width; x++) {
                // Create a pseudo-random but consistent pattern based on position
                const frequency = 0.05;
                const amplitude1 = Math.sin(x * frequency) * 0.4;
                const amplitude2 = Math.sin(x * frequency * 2.3) * 0.3;
                const amplitude3 = Math.sin(x * frequency * 0.7) * 0.2;
                const totalAmplitude = Math.abs(amplitude1 + amplitude2 + amplitude3);
                
                const barHeight = totalAmplitude * height;
                const barY = centerY - barHeight / 2;
                
                ctx.fillRect(x, barY, 1, barHeight);
            }
            
            console.log(`📊 Drew simple waveform for ${side} deck`);
        }

        function togglePlay(side) {
            // Check if track is loaded (either buffer for desktop or audioElement for mobile)
            const trackLoaded = USE_HTML5_AUDIO ? tracks[side].audioElement : tracks[side].buffer;
            
            if (!trackLoaded) {
                showNotification(`Load ${side} track first!`, 'error');
                return;
            }

            if (tracks[side].isPlaying) {
                pauseTrack(side);
            } else {
                playTrack(side);
            }
        }

        function playTrack(side) {
            const track = tracks[side];
            
            if (USE_HTML5_AUDIO) {
                // Mobile: Use HTML5 Audio
                if (!track.audioElement) {
                    showNotification('Track not loaded', 'error');
                    return;
                }
                
                // Get current crossfader position and apply volume
                const sliderValue = document.getElementById('trackSlider').value;
                const volume = side === 'left' ? (100 - sliderValue) / 100 : sliderValue / 100;
                track.audioElement.volume = volume;
                
                console.log(`🎵 Playing ${side} track - Volume: ${(volume * 100).toFixed(0)}% (slider: ${sliderValue})`);
                
                if (track.pauseTime > 0) {
                    track.audioElement.currentTime = track.pauseTime;
                } else {
                    track.audioElement.currentTime = 0;
                }
                
                track.audioElement.play()
                    .then(() => {
                        track.isPlaying = true;
                        track.startTime = Date.now() / 1000 - track.pauseTime;
                        
                        const playButton = document.getElementById(side + 'Play');
                        playButton.classList.add('playing');
                        playButton.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
                        
                        document.getElementById(side + 'Vinyl').classList.add('spinning');
                        
                        // Start playhead animation for mobile
                        updatePlayhead(side);
                        
                        console.log(`▶️ ${side} track playing (HTML5) at ${(volume * 100).toFixed(0)}% volume`);
                    })
                    .catch(error => {
                        console.error('Play error:', error);
                        showNotification('Tap to enable audio first', 'error');
                    });
                
            } else {
                // Desktop: Use Web Audio API
                const ctx = getAudioContext();
                const source = ctx.createBufferSource();
                const gainNode = ctx.createGain();
                
                source.buffer = track.buffer;
                source.loop = true;
                
                const sliderValue = document.getElementById('trackSlider').value;
                const volume = side === 'left' ? (100 - sliderValue) / 100 : sliderValue / 100;
                gainNode.gain.value = volume;
                
                source.connect(gainNode);
                gainNode.connect(ctx.destination);
                source.start(0, track.pauseTime);
                
                track.source = source;
                track.gainNode = gainNode;
                track.isPlaying = true;
                track.startTime = ctx.currentTime - track.pauseTime;
                
                const playButton = document.getElementById(side + 'Play');
                playButton.classList.add('playing');
                playButton.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
                
                document.getElementById(side + 'Vinyl').classList.add('spinning');
                
                updatePlayhead(side);
            }
        }

        function pauseTrack(side) {
            const track = tracks[side];
            
            if (USE_HTML5_AUDIO) {
                // Mobile: Pause HTML5 Audio
                if (track.audioElement) {
                    track.audioElement.pause();
                    track.pauseTime = track.audioElement.currentTime;
                }
            } else {
                // Desktop: Stop Web Audio source
                if (track.source) {
                    track.pauseTime = getAudioContext().currentTime - track.startTime;
                    track.source.stop();
                    track.source = null;
                    track.gainNode = null;
                }
            }
            
            track.isPlaying = false;
            
            const playButton = document.getElementById(side + 'Play');
            playButton.classList.remove('playing');
            playButton.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
            
            document.getElementById(side + 'Vinyl').classList.remove('spinning');
            
            if (animationFrames[side]) {
                cancelAnimationFrame(animationFrames[side]);
            }
        }

        function stopTrack(side) {
            pauseTrack(side);
            tracks[side].pauseTime = 0;
            document.getElementById(side + 'Playhead').style.left = '0%';
            if (tracks[side].buffer) {
                document.getElementById(side + 'Time').textContent = '0:00 / ' + formatTime(Math.floor(tracks[side].buffer.duration));
            }
        }

        function ejectTrack(side) {
            stopTrack(side);
            
            tracks[side].buffer = null;
            tracks[side].bpm = null;
            tracks[side].name = null;
            tracks[side].pauseTime = 0;
            
            document.getElementById(side + 'BPM').textContent = '--';
            document.getElementById(side + 'TrackName').textContent = 'No Track';
            document.getElementById(side + 'Turntable').classList.remove('loaded');
            document.getElementById(side + 'Eject').disabled = true;
            
            const canvas = document.getElementById(side + 'Canvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(10, 10, 20, 0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            document.getElementById(side + 'Time').textContent = '0:00 / 0:00';
            
            showNotification(`${side} track ejected`, 'success');
        }

        function updatePlayhead(side) {
            if (!tracks[side].isPlaying) return;
            
            let currentTime, duration;
            
            if (USE_HTML5_AUDIO) {
                // Mobile: Get time from HTML5 Audio element
                if (!tracks[side].audioElement) return;
                currentTime = tracks[side].audioElement.currentTime;
                duration = tracks[side].audioElement.duration || 1;
            } else {
                // Desktop: Get time from Web Audio API
                currentTime = audioContext.currentTime - tracks[side].startTime;
                duration = tracks[side].buffer.duration;
            }
            
            const percentage = (currentTime % duration) / duration;
            
            document.getElementById(side + 'Playhead').style.left = (percentage * 100) + '%';
            
            const elapsed = Math.floor(currentTime % duration);
            const total = Math.floor(duration);
            document.getElementById(side + 'Time').textContent = formatTime(elapsed) + ' / ' + formatTime(total);
            
            animationFrames[side] = requestAnimationFrame(() => updatePlayhead(side));
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        function seekTrack(event, side) {
            // Check if track is loaded (mobile or desktop)
            const trackLoaded = USE_HTML5_AUDIO ? tracks[side].audioElement : tracks[side].buffer;
            if (!trackLoaded) return;
            
            // Get position from either mouse or touch event
            const rect = event.currentTarget.getBoundingClientRect();
            let x;
            
            if (event.touches && event.touches.length > 0) {
                // Touch event (mobile)
                x = event.touches[0].clientX - rect.left;
            } else if (event.changedTouches && event.changedTouches.length > 0) {
                // Touch end event (mobile)
                x = event.changedTouches[0].clientX - rect.left;
            } else {
                // Mouse event (desktop)
                x = event.clientX - rect.left;
            }
            
            const percentage = Math.max(0, Math.min(1, x / rect.width));
            
            let duration;
            if (USE_HTML5_AUDIO) {
                duration = tracks[side].audioElement.duration || 1;
            } else {
                duration = tracks[side].buffer.duration;
            }
            
            const seekTime = duration * percentage;
            
            const wasPlaying = tracks[side].isPlaying;
            
            if (wasPlaying) {
                pauseTrack(side);
            }
            
            tracks[side].pauseTime = seekTime;
            
            // For mobile, also set the audio element's currentTime
            if (USE_HTML5_AUDIO && tracks[side].audioElement) {
                tracks[side].audioElement.currentTime = seekTime;
            }
            
            document.getElementById(side + 'Playhead').style.left = (percentage * 100) + '%';
            
            const elapsed = Math.floor(seekTime);
            const total = Math.floor(duration);
            document.getElementById(side + 'Time').textContent = formatTime(elapsed) + ' / ' + formatTime(total);
            
            if (wasPlaying) {
                playTrack(side);
            }
            
            console.log(`⏩ Seeked ${side} to ${formatTime(elapsed)}`);
        }

        function updateCrossfade(value) {
            const leftGain = (100 - value) / 100;
            const rightGain = value / 100;
            
            console.log(`🎚️ Crossfade: ${value} | Left: ${(leftGain * 100).toFixed(0)}% | Right: ${(rightGain * 100).toFixed(0)}%`);
            
            if (USE_HTML5_AUDIO) {
                // Mobile: Use PAUSE/PLAY approach instead of volume
                // This is more reliable on mobile browsers
                
                if (tracks.left.audioElement) {
                    if (leftGain === 0 && tracks.left.isPlaying) {
                        // Completely fade out left - pause it
                        tracks.left.audioElement.pause();
                        tracks.left.audioElement.volume = 0;
                        console.log(`  🔇 Left track MUTED (paused)`);
                    } else if (leftGain > 0) {
                        // Fade in left - ensure it's playing
                        tracks.left.audioElement.volume = leftGain;
                        if (tracks.left.isPlaying && tracks.left.audioElement.paused) {
                            tracks.left.audioElement.play().catch(e => console.log('Play error:', e));
                        }
                        console.log(`  🔊 Left track at ${(leftGain * 100).toFixed(0)}%`);
                    }
                }
                
                if (tracks.right.audioElement) {
                    if (rightGain === 0 && tracks.right.isPlaying) {
                        // Completely fade out right - pause it
                        tracks.right.audioElement.pause();
                        tracks.right.audioElement.volume = 0;
                        console.log(`  🔇 Right track MUTED (paused)`);
                    } else if (rightGain > 0) {
                        // Fade in right - ensure it's playing
                        tracks.right.audioElement.volume = rightGain;
                        if (tracks.right.isPlaying && tracks.right.audioElement.paused) {
                            tracks.right.audioElement.play().catch(e => console.log('Play error:', e));
                        }
                        console.log(`  🔊 Right track at ${(rightGain * 100).toFixed(0)}%`);
                    }
                }
            } else {
                // Desktop: Update Web Audio gain nodes
                if (tracks.left.gainNode) {
                    tracks.left.gainNode.gain.value = leftGain;
                }
                if (tracks.right.gainNode) {
                    tracks.right.gainNode.gain.value = rightGain;
                }
            }
            
            document.getElementById('trackName').textContent = 
                value < 30 ? 'Left Track' : 
                value > 70 ? 'Right Track' : 
                'Mix';
        }

        function skipBackward() {
            ['left', 'right'].forEach(side => {
                if (tracks[side].buffer) {
                    const wasPlaying = tracks[side].isPlaying;
                    if (wasPlaying) pauseTrack(side);
                    tracks[side].pauseTime = Math.max(0, tracks[side].pauseTime - 10);
                    if (wasPlaying) playTrack(side);
                }
            });
        }

        function skipForward() {
            ['left', 'right'].forEach(side => {
                if (tracks[side].buffer) {
                    const wasPlaying = tracks[side].isPlaying;
                    if (wasPlaying) pauseTrack(side);
                    tracks[side].pauseTime = Math.min(tracks[side].buffer.duration - 1, tracks[side].pauseTime + 10);
                    if (wasPlaying) playTrack(side);
                }
            });
        }

        function stopAllSounds() {
            ['left', 'right'].forEach(side => {
                if (tracks[side].buffer) {
                    stopTrack(side);
                }
            });
            showNotification('All sounds stopped!', 'success');
        }

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Mobile playlist toggle
        function togglePlaylist() {
            const sidebar = document.querySelector('.playlist-sidebar');
            sidebar.classList.toggle('mobile-open');
        }

        // Close playlist when clicking outside on mobile
        document.addEventListener('click', (e) => {
            const sidebar = document.querySelector('.playlist-sidebar');
            const toggle = document.getElementById('playlistToggle');
            
            if (window.innerWidth <= 768 && 
                sidebar.classList.contains('mobile-open') && 
                !sidebar.contains(e.target) && 
                e.target !== toggle) {
                sidebar.classList.remove('mobile-open');
            }
        });

        // Initialize everything
        initPads();
        loadAllPadSounds(); // ← This was missing!
        loadPlaylistFromGitHub();
        
        // Add mobile-specific crossfader event listeners
        const trackSlider = document.getElementById('trackSlider');
        if (trackSlider) {
            // Add multiple event types for better mobile compatibility
            trackSlider.addEventListener('input', (e) => {
                updateCrossfade(e.target.value);
            });
            trackSlider.addEventListener('change', (e) => {
                updateCrossfade(e.target.value);
            });
            // For mobile touch
            trackSlider.addEventListener('touchmove', (e) => {
                updateCrossfade(e.target.value);
            });
            trackSlider.addEventListener('touchend', (e) => {
                updateCrossfade(e.target.value);
            });
            console.log('✅ Crossfader event listeners added');
        }
        
        // Add touch event listeners for waveform seeking (mobile)
        const leftWaveform = document.getElementById('leftWaveform');
        const rightWaveform = document.getElementById('rightWaveform');
        
        if (leftWaveform) {
            leftWaveform.addEventListener('touchstart', (e) => {
                e.preventDefault(); // Prevent scrolling
                seekTrack(e, 'left');
            });
            leftWaveform.addEventListener('touchmove', (e) => {
                e.preventDefault(); // Prevent scrolling while dragging
                seekTrack(e, 'left');
            });
            leftWaveform.addEventListener('touchend', (e) => {
                e.preventDefault();
                seekTrack(e, 'left');
            });
        }
        
        if (rightWaveform) {
            rightWaveform.addEventListener('touchstart', (e) => {
                e.preventDefault(); // Prevent scrolling
                seekTrack(e, 'right');
            });
            rightWaveform.addEventListener('touchmove', (e) => {
                e.preventDefault(); // Prevent scrolling while dragging
                seekTrack(e, 'right');
            });
            rightWaveform.addEventListener('touchend', (e) => {
                e.preventDefault();
                seekTrack(e, 'right');
            });
        }
        
        console.log('✅ Waveform touch event listeners added');

        // Mobile audio unlock - CRITICAL for iOS/Android
        let audioUnlocked = false;
        let unlockAttempts = 0;

        async function unlockAudio() {
            if (audioUnlocked) return;
            if (USE_HTML5_AUDIO) return; // Skip on mobile - HTML5 Audio doesn't need unlock
            if (!audioContext) return; // Skip if no audio context
            
            unlockAttempts++;
            console.log(`🔓 Attempting audio unlock (attempt ${unlockAttempts})...`);
            
            try {
                // Method 1: Resume audio context
                if (audioContext && audioContext.state === 'suspended') {
                    await audioContext.resume();
                    console.log('✅ Audio context resumed');
                }

                // Method 2: Create and play silent buffer (iOS trick)
                const buffer = audioContext.createBuffer(1, 1, 22050);
                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(audioContext.destination);
                source.start(0);
                console.log('✅ Silent buffer played');

                // Method 3: Create actual sound for verification
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                gainNode.gain.value = 0.01; // Very quiet
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.01);
                console.log('✅ Test tone played');

                audioUnlocked = true;
                const unlockBtn = document.getElementById('audioUnlockBtn');
                if (unlockBtn) unlockBtn.classList.remove('show');
                showNotification('🔊 Audio Ready!', 'success');
                
            } catch (error) {
                console.error('❌ Audio unlock failed:', error);
                
                // Show manual unlock button after 2 failed attempts
                if (unlockAttempts >= 2) {
                    const unlockBtn = document.getElementById('audioUnlockBtn');
                    if (unlockBtn) unlockBtn.classList.add('show');
                }
            }
        }

        // Manual unlock for stubborn devices
        async function manualAudioUnlock() {
            console.log('🖱️ Manual audio unlock triggered');
            const btn = document.getElementById('audioUnlockBtn');
            
            // Hide button immediately
            btn.classList.remove('show');
            btn.style.display = 'none';
            
            // Mark as unlocked
            audioUnlocked = true;
            
            if (USE_HTML5_AUDIO) {
                // For HTML5 audio, just play a test sound
                if (pads[0] && pads[0].audioElement) {
                    try {
                        const testAudio = pads[0].audioElement.cloneNode();
                        testAudio.volume = 0.3;
                        await testAudio.play();
                        console.log('✅ HTML5 test sound played');
                        showNotification('🔊 Audio enabled!', 'success');
                    } catch (e) {
                        console.error('❌ Test sound failed:', e);
                        showNotification('Please tap a drum pad', 'error');
                    }
                }
            } else {
                // For Web Audio API
                await unlockAudio();
                
                // Force audio context to running state
                const ctx = getAudioContext();
                if (ctx.state === 'suspended') {
                    await ctx.resume();
                }
                
                // Play a test sound to confirm
                if (pads[0] && pads[0].audioBuffer) {
                    try {
                        const source = ctx.createBufferSource();
                        const gainNode = ctx.createGain();
                        source.buffer = pads[0].audioBuffer;
                        gainNode.gain.value = 0.3;
                        source.connect(gainNode);
                        gainNode.connect(ctx.destination);
                        source.start(0);
                        console.log('✅ Web Audio test sound played');
                        showNotification('🔊 Audio enabled!', 'success');
                    } catch (e) {
                        console.error('❌ Test sound failed:', e);
                    }
                }
            }
        }

        // Multiple event listeners for maximum compatibility
        const unlockEvents = ['touchstart', 'touchend', 'mousedown', 'click', 'keydown'];
        
        unlockEvents.forEach(eventType => {
            document.addEventListener(eventType, function unlockHandler() {
                unlockAudio();
                // Keep trying until audio is truly unlocked
                if (audioUnlocked) {
                    unlockEvents.forEach(evt => {
                        document.removeEventListener(evt, unlockHandler);
                    });
                }
            }, { passive: true });
        });

        // Show unlock button on mobile after pads load
        setTimeout(() => {
            if (!audioUnlocked && USE_HTML5_AUDIO) {
                const btn = document.getElementById('audioUnlockBtn');
                btn.classList.add('show');
                btn.style.display = 'block';
                console.log('⚠️ Showing manual unlock button for mobile');
            }
        }, 2000);

        // Additional audio context state monitoring (desktop only)
        if (audioContext) {
            audioContext.onstatechange = () => {
                console.log(`🎵 Audio context state: ${audioContext.state}`);
                if (audioContext.state === 'running') {
                    audioUnlocked = true;
                    const btn = document.getElementById('audioUnlockBtn');
                    if (btn) btn.classList.remove('show');
                }
            };
        }

        // Ensure audio context resumes on every interaction (desktop only)
        document.addEventListener('touchstart', () => {
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }, { passive: true });

        // Force unlock on pad play (desktop only)
        const originalPlayPad = playPad;
        window.playPad = function(index) {
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume().then(() => {
                    originalPlayPad(index);
                });
            } else {
                originalPlayPad(index);
            }
        };
    </script>
