<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Drum Test</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
        }
        .pad {
            width: 150px;
            height: 150px;
            background: #ff0066;
            margin: 20px;
            display: inline-block;
            text-align: center;
            line-height: 150px;
            font-size: 24px;
            cursor: pointer;
            border-radius: 10px;
        }
        #log {
            background: #111;
            padding: 10px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>🥁 Mobile Drum Test</h1>
    <p>Tap the pads below:</p>
    
    <div class="pad" id="pad1" ontouchstart="playSound(1)" onclick="playSound(1)">
        PAD 1
    </div>
    <div class="pad" id="pad2" ontouchstart="playSound(2)" onclick="playSound(2)">
        PAD 2
    </div>
    
    <div id="log"></div>
    
    <script>
        const BASE_URL = 'https://aaron-chen-angus.github.io/intelliCARE-DJ';
        let audio1, audio2;
        
        function log(msg) {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML = `[${time}] ${msg}<br>` + logDiv.innerHTML;
            console.log(msg);
        }
        
        // Load sounds
        log('Loading sounds...');
        audio1 = new Audio(`${BASE_URL}/sounds/01%20hihat2.mp3`);
        audio2 = new Audio(`${BASE_URL}/sounds/02%20clap.mp3`);
        
        audio1.addEventListener('loadeddata', () => log('✅ Sound 1 loaded'));
        audio2.addEventListener('loadeddata', () => log('✅ Sound 2 loaded'));
        
        audio1.load();
        audio2.load();
        
        function playSound(num) {
            log(`🎯 Tapped pad ${num}`);
            
            const audio = num === 1 ? audio1 : audio2;
            
            if (!audio) {
                log('❌ Audio not loaded');
                return;
            }
            
            log(`   Audio src: ${audio.src}`);
            log(`   Audio readyState: ${audio.readyState}`);
            log(`   Audio paused: ${audio.paused}`);
            
            try {
                // Create fresh audio each time
                const freshAudio = new Audio(audio.src);
                freshAudio.volume = 1.0;
                
                log('   Playing...');
                
                freshAudio.play()
                    .then(() => {
                        log(`✅ Sound ${num} playing!`);
                    })
                    .catch(error => {
                        log(`❌ Play error: ${error.name} - ${error.message}`);
                    });
            } catch (e) {
                log(`❌ Exception: ${e.message}`);
            }
        }
        
        log('✅ Test page loaded');
        log('Tap a pad to test sound');
    </script>
</body>
</html>
